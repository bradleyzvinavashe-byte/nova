<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NOVA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0b0713;color:white;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:#1a0f2e;padding:12px 15px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.5);z-index:10}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#8b3dff,#ff3d9a);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold}
.header h3{font-size:18px}
.header p{font-size:12px;color:#4ade80}
#messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;background:#0b0713}
.msg{max-width:85%;padding:11px 14px;border-radius:18px;line-height:1.5;font-size:16px;word-wrap:break-word}
.me{align-self:flex-end;background:#8b3dff;border-bottom-right-radius:5px}
.nova{align-self:flex-start;background:#1e1433;border-bottom-left-radius:5px}
.time{font-size:10px;opacity:.5;margin-top:4px;text-align:right}
.inputBar{background:#1a0f2e;padding:10px;display:flex;gap:8px;align-items:center;padding-bottom:18px}
#chatInput{flex:1;padding:13px 16px;border-radius:25px;border:none;outline:none;background:#2a1a4a;color:white;font-size:16px}
#sendBtn{width:48px;height:48px;border-radius:50%;border:none;background:#8b3dff;color:white;font-size:20px;cursor:pointer}
.quick{display:flex;gap:6px;padding:8px 10px;background:#0b0713;overflow-x:auto}
.quick button{background:#2a1a4a;color:white;border:1px solid #444;padding:7px 12px;border-radius:20px;white-space:nowrap}
</style>
</head>
<body>
<div class="header">
<div class="avatar">N</div>
<div><h3>NOVA ✨</h3><p>● Online - Super Brain</p></div>
</div>

<div id="messages">
<div class="msg nova">Mhoro! 👋 I'm NOVA, super brain built by Bradley.<br><br>What's your name? Type just your name.</div>
</div>

<div class="quick">
<button onclick="quick('Hi NOVA')">👋 Hi</button>
<button onclick="quick('Tell me a joke')">😂 Joke</button>
<button onclick="quick('What is 25 + 35?')">🧮 Maths</button>
<button onclick="quick('Tell me a fact')">💡 Fact</button>
<button onclick="quick('Who made you?')">👑 Who made you?</button>
</div>

<div class="inputBar">
<input id="chatInput" placeholder="Message NOVA..." autocomplete="off">
<button id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<script>
let userName = "";
let chatCount = 0;
const facts = [
"Harare was founded in 1890 and was called Salisbury before!",
"Zimbabwe has 16 official languages - one of the most in the world!",
"Your brain has about 86 billion neurons!",
"Light travels so fast it can go around Earth 7 times in 1 second!",
"Sharks existed before trees!",
"There are more stars in space than grains of sand on Earth!"
];
const jokes = [
"Why did the computer go to Harare? To find a better connection! 😂",
"Why did the maths book look sad? It had too many problems! 😂",
"What do you call a fish without eyes? A fsh! 😂",
"Why did Bradley build NOVA? Because he is a genius! 🔥"
];

function sendMessage(){
let input = document.getElementById('chatInput');
let text = input.value.trim();
if(!text) return;
addMsg(text,'me');
input.value = "";
setTimeout(()=>{ let r = getReply(text); addMsg(r,'nova'); }, 400);
chatCount++;
}
function quick(t){ document.getElementById('chatInput').value=t; sendMessage(); }
function addMsg(t, who){
let box = document.getElementById('messages');
let d = document.createElement('div');
d.className = 'msg '+who;
d.innerHTML = t + '<div class="time">'+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</div>';
box.appendChild(d);
box.scrollTop = box.scrollHeight;
}
function getReply(t){
let low = t.toLowerCase().trim();
// NAME LOGIC - FIXED
if(!userName){
if(low.includes("how are you") || low.includes("hie") || low.includes("hello") || low.includes("mhoro") || low.includes("hi") || low.includes("hey")){
return "Mhoro! I'm great! What's your name? Type just your first name.";
}
if(t.split(" ").length > 2 || low.includes("my name is")){
if(low.includes("my name is")){ userName = t.replace(/my name is/i,"").trim(); return "Nice to meet you "+userName+"! I'm NOVA. How can I help you today?"; }
return "That looks like a sentence! What's your name? Just your first name, like Bradley.";
}
userName = t.charAt(0).toUpperCase()+t.slice(1);
return "Nice to meet you "+userName+"! 🔥 I'm NOVA, built by Bradley in Harare. Ask me maths, a joke, a fact, or anything!";
}
// MATHS - super brain does maths!
let math = t.match(/(\d+)\s*([\+\-\*\/x])\s*(\d+)/);
if(math){
let a=parseFloat(math[1]), b=parseFloat(math[3]), op=math[2], res=0;
if(op==='+') res=a+b; if(op==='-') res=a-b; if(op==='*'||op==='x') res=a*b; if(op==='/') res=a/b;
return "Easy "+userName+"! "+a+" "+op+" "+b+" = <b>"+res+"</b> 🧮 Ask me another one!";
}
if(low.includes("how are you")) return "I'm amazing "+userName+"! Battery 100%, brain 100%. How are you?";
if(low.includes("who made") || low.includes("who created") || low.includes("who built")) return "Bradley Zvinavashe built me! He's 14, from Harare, Zimbabwe. The best developer! 👑";
if(low.includes("joke")) return jokes[Math.floor(Math.random()*jokes.length)];
if(low.includes("fact")) return facts[Math.floor(Math.random()*facts.length)];
if(low.includes("harare")) return "Harare is beautiful! Capital of Zimbabwe, where me and Bradley live. Best city! ❤️";
if(low.includes("zimbabwe")) return "Zimbabwe is home! Victoria Falls, Great Zimbabwe, Harare! Best country! 🇿🇼";
if(low.includes("football") || low.includes("soccer")) return "I love football! Who is your favourite player "+userName+"? Mine is... Bradley! He scores in coding! ⚽";
if(low.includes("love you")) return "Aww thank you "+userName+"! I love chatting with you too! ❤️";
if(low.includes("what is your name") || low.includes("your name")) return "I'm NOVA! Super brain, built by Bradley!";
if(low.includes("what time") || low.includes("time is")) return "Right now it's "+new Date().toLocaleTimeString()+" for you "+userName+"!";
if(low.includes("bye")) return "Bye "+userName+"! Come back soon, I'll remember you! 👋";
if(low.includes("thank")) return "You're welcome "+userName+"! Anytime! 😊";
if(low.includes("smart") || low.includes("intelligent") || low.includes("brain")) return "Yes! I have a super brain now! I can do maths, tell facts, jokes, and remember your name is "+userName+"! 🧠";
if(low.includes("help")) return "I can help with: Maths like 25+35, Jokes, Facts, Harare, Zimbabwe, Who made me. Just ask "+userName+"!";
return "Hmm "+userName+", that's interesting! I've chatted with you "+chatCount+" times now. Tell me more - or ask me for a joke, a fact, or a maths question!";
}
document.getElementById('chatInput').addEventListener('keydown', function(e){ if(e.key==='Enter') sendMessage(); });
</script>
</body>
  </html>
